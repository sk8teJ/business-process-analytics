name: Python and database checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: business_analytics
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d business_analytics"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: business_analytics
      DB_USER: postgres
      DB_PASSWORD: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile Python files
        run: python -m compileall -q app scripts tests

      - name: Run unit tests
        run: python -m pytest -q

      - name: Create database schema
        run: psql -h localhost -U postgres -d business_analytics -v ON_ERROR_STOP=1 -f database/schema.sql

      - name: Generate synthetic dataset
        run: python scripts/generate_data.py --yes

      - name: Check database connection and dataset
        run: python scripts/test_connection.py

      - name: Execute analytical SQL queries
        run: |
          psql -h localhost -U postgres -d business_analytics -v ON_ERROR_STOP=1 -f database/queries/01_business_metrics.sql
          psql -h localhost -U postgres -d business_analytics -v ON_ERROR_STOP=1 -f database/queries/02_delivery_analysis.sql
          psql -h localhost -U postgres -d business_analytics -v ON_ERROR_STOP=1 -f database/queries/03_process_analysis.sql

      - name: Smoke test Streamlit dashboard
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest

          app = AppTest.from_file("app/main.py", default_timeout=30).run()
          if app.exception:
              for error in app.exception:
                  print(error.message)
              raise SystemExit("Dashboard smoke test failed")
          print("Dashboard rendered without Streamlit exceptions")
          PY
